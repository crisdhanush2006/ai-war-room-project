<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI War Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #16181d;
    color: #e6e6e6;
    font-family: 'Inter', sans-serif;
    padding: 40px 20px 80px;
  }

  .wrap { max-width: 700px; margin: 0 auto; }

  h1 { font-size: 32px; margin: 0 0 8px; }
  header p { color: #9a9a9a; font-size: 14px; margin: 0 0 30px; }

  textarea {
    width: 100%;
    min-height: 70px;
    background: #1f2126;
    border: 1px solid #33363c;
    color: #e6e6e6;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 12px;
    border-radius: 6px;
    resize: vertical;
  }
  textarea:focus { outline: none; border-color: #5b8cff; }
  textarea::placeholder { color: #666; }

  .mode-row { display: flex; gap: 10px; margin-top: 12px; }

  .mode-btn {
    flex: 1;
    background: #1f2126;
    border: 1px solid #33363c;
    color: #9a9a9a;
    font-weight: 600;
    font-size: 13px;
    padding: 12px;
    border-radius: 6px;
    cursor: pointer;
    text-align: left;
  }
  .mode-btn small { display: block; font-weight: 400; color: #6b7076; margin-top: 2px; }
  .mode-btn.active { border-color: #5b8cff; background: #1e2a4a; color: #e6e6e6; }
  .mode-btn.active small { color: #9db3ff; }

  button.run {
    background: #5b8cff;
    color: #fff;
    border: none;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 14px;
  }
  button.run:hover:not(:disabled) { background: #4a76e0; }
  button.run:disabled { background: #444; cursor: not-allowed; }

  #downloadBtn {
    display: none;
    background: #2d3138;
    color: #e6e6e6;
    border: none;
    font-weight: 600;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 14px;
    margin-left: 8px;
  }
  #downloadBtn:hover { background: #383d45; }

  #loading { display: none; color: #9a9a9a; font-size: 13px; margin-top: 14px; }
  #loading::before {
    content: '';
    display: inline-block;
    width: 8px; height: 8px;
    background: #5b8cff;
    border-radius: 50%;
    margin-right: 8px;
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

  .card {
    background: #1f2126;
    border: 1px solid #33363c;
    border-radius: 8px;
    padding: 18px 20px;
    margin-top: 14px;
  }
  .card h3 { margin: 0 0 10px; font-size: 15px; color: #5b8cff; }
  .card.verdict h3 { color: #4caf7d; }
  .card-body { font-size: 13px; line-height: 1.7; color: #cfcfcf; white-space: pre-wrap; }

  #followupSection {
    display: none;
    margin-top: 24px;
    border-top: 1px solid #33363c;
    padding-top: 20px;
  }
  #followupSection h4 { font-size: 14px; color: #9db3ff; margin: 0 0 10px; }

  #chatLog { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }

  .chat-q {
    background: #1e2a4a;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #cfd8ff;
    align-self: flex-end;
    max-width: 85%;
  }
  .chat-a {
    background: #1f2126;
    border: 1px solid #33363c;
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.6;
    color: #cfcfcf;
    white-space: pre-wrap;
    align-self: flex-start;
    max-width: 90%;
  }

  .followup-row { display: flex; gap: 8px; }

  #followupInput {
    flex: 1;
    background: #1f2126;
    border: 1px solid #33363c;
    color: #e6e6e6;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
  }
  #followupInput:focus { outline: none; border-color: #5b8cff; }

  #askBtn {
    background: #5b8cff;
    color: #fff;
    border: none;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
  }
  #askBtn:hover:not(:disabled) { background: #4a76e0; }
  #askBtn:disabled { background: #444; cursor: not-allowed; }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>🏛️ AI War Room</h1>
    <p>Type a problem below. Multiple AI agents will analyze, propose, critique, and judge solutions.</p>
  </header>

  <textarea id="problemInput" placeholder="e.g. How do we reduce food delivery time in a city with heavy traffic?"></textarea>

  <div class="mode-row">
    <button class="mode-btn" id="quickBtn" onclick="setMode('quick')">
      Quick
      <small>4 agents · faster</small>
    </button>
    <button class="mode-btn active" id="fullBtn" onclick="setMode('full')">
      Full
      <small>8 agents · thorough</small>
    </button>
  </div>

  <br>
  <button class="run" id="runBtn" onclick="runWarRoom()">Run War Room</button>
  <button id="downloadBtn" onclick="downloadPDF()">⬇ Download as PDF</button>
  <div id="loading">Running agents...</div>

  <div id="results"></div>

  <div id="followupSection">
    <h4>💬 Ask a follow-up</h4>
    <div id="chatLog"></div>
    <div class="followup-row">
      <input id="followupInput" type="text" placeholder="e.g. Why did Solution B lose?" />
      <button id="askBtn" onclick="askFollowUp()">Ask</button>
    </div>
  </div>

</div>

<script>
let currentMode = 'full';
let lastResult = null;
let lastProblem = '';

function setMode(mode) {
  currentMode = mode;
  document.getElementById('quickBtn').classList.toggle('active', mode === 'quick');
  document.getElementById('fullBtn').classList.toggle('active', mode === 'full');
}

async function runWarRoom() {
  const problem = document.getElementById('problemInput').value;
  if (!problem.trim()) {
    alert('Please enter a problem first.');
    return;
  }

  const btn = document.getElementById('runBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');
  const followupSection = document.getElementById('followupSection');
  const chatLog = document.getElementById('chatLog');

  btn.disabled = true;
  downloadBtn.style.display = 'none';
  followupSection.style.display = 'none';
  chatLog.innerHTML = '';
  loading.style.display = 'block';
  results.innerHTML = '';

  const fullSteps = [
    'Analyzing the problem...',
    'Generating Solution A...',
    'Refining Solution A...',
    'Generating Solution B...',
    'Running cost critique...',
    'Running feasibility critique...',
    'Red Team attacking Solution B...',
    'Judge weighing both solutions...'
  ];
  const quickSteps = [
    'Analyzing the problem...',
    'Generating Solution A...',
    'Refining Solution A...'
  ];
  const steps = currentMode === 'quick' ? quickSteps : fullSteps;

  let stepIndex = 0;
  loading.textContent = steps[0];
  const stepTimer = setInterval(() => {
    stepIndex = (stepIndex + 1) % steps.length;
    loading.textContent = steps[stepIndex];
  }, 6000);

  try {
    const response = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ problem, mode: currentMode })
    });

    if (!response.ok) {
      const errData = await response.json();
      throw new Error(errData.error || 'Something went wrong.');
    }

    const data = await response.json();
    lastResult = data;
    lastProblem = problem;

    let html = `
      <div class="card"><h3>🧩 Problem Analysis</h3><div class="card-body">${data.analysis.analysis}</div></div>
      <div class="card"><h3>💡 Solution A</h3><div class="card-body">${data.solutionA.analysis}</div></div>
      <div class="card"><h3>✨ Refined Solution A</h3><div class="card-body">${data.refinedA.analysis}</div></div>
    `;

    if (data.mode === 'full') {
      html += `
        <div class="card"><h3>💡 Solution B</h3><div class="card-body">${data.solutionB.analysis}</div></div>
        <div class="card"><h3>💰 Cost Critique (on B)</h3><div class="card-body">${data.costReview.analysis}</div></div>
        <div class="card"><h3>🔧 Feasibility Critique (on B)</h3><div class="card-body">${data.feasibilityReview.analysis}</div></div>
        <div class="card"><h3>⚔️ Red Team (on B)</h3><div class="card-body">${data.redTeamReview.analysis}</div></div>
        <div class="card verdict"><h3>⚖️ Final Verdict</h3><div class="card-body">${data.verdict.analysis}</div></div>
      `;
    }

    results.innerHTML = html;
    downloadBtn.style.display = 'inline-block';
    followupSection.style.display = 'block';
  } catch (err) {
    results.innerHTML = `<div class="card">${err.message || 'Something went wrong. Please try again.'}</div>`;
    console.error(err);
  } finally {
    clearInterval(stepTimer);
    btn.disabled = false;
    loading.style.display = 'none';
  }
}

async function askFollowUp() {
  const input = document.getElementById('followupInput');
  const question = input.value.trim();
  if (!question || !lastResult) return;

  const askBtn = document.getElementById('askBtn');
  const chatLog = document.getElementById('chatLog');

  const qDiv = document.createElement('div');
  qDiv.className = 'chat-q';
  qDiv.textContent = question;
  chatLog.appendChild(qDiv);

  const aDiv = document.createElement('div');
  aDiv.className = 'chat-a';
  aDiv.textContent = 'Thinking...';
  chatLog.appendChild(aDiv);

  input.value = '';
  askBtn.disabled = true;

  const context = {
    problem: lastProblem,
    analysis: lastResult.analysis.analysis,
    solutionA: lastResult.refinedA.analysis,
    solutionB: lastResult.mode === 'full' ? lastResult.solutionB.analysis : null,
    verdict: lastResult.mode === 'full' ? lastResult.verdict.analysis : null
  };

  try {
    const response = await fetch('/api/followup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ context, question })
    });

    if (!response.ok) {
      const errData = await response.json();
      throw new Error(errData.error || 'Something went wrong.');
    }

    const data = await response.json();
    aDiv.textContent = data.answer;
  } catch (err) {
    aDiv.textContent = err.message || 'Something went wrong. Please try again.';
  } finally {
    askBtn.disabled = false;
  }
}

function downloadPDF() {
  if (!lastResult) return;

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 15;
  const maxWidth = pageWidth - margin * 2;
  let y = 20;

  function addSection(title, text) {
    if (y > 270) { doc.addPage(); y = 20; }
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.text(title, margin, y);
    y += 8;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    const lines = doc.splitTextToSize(text, maxWidth);
    lines.forEach(line => {
      if (y > 280) { doc.addPage(); y = 20; }
      doc.text(line, margin, y);
      y += 5.5;
    });
    y += 8;
  }

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(18);
  doc.text('AI War Room Report', margin, y);
  y += 10;
  doc.setFont('helvetica', 'italic');
  doc.setFontSize(11);
  const problemLines = doc.splitTextToSize('Problem: ' + lastProblem, maxWidth);
  problemLines.forEach(line => { doc.text(line, margin, y); y += 6; });
  y += 6;

  addSection('Problem Analysis', lastResult.analysis.analysis);
  addSection('Solution A', lastResult.solutionA.analysis);
  addSection('Refined Solution A', lastResult.refinedA.analysis);

  if (lastResult.mode === 'full') {
    addSection('Solution B', lastResult.solutionB.analysis);
    addSection('Cost Critique (on B)', lastResult.costReview.analysis);
    addSection('Feasibility Critique (on B)', lastResult.feasibilityReview.analysis);
    addSection('Red Team (on B)', lastResult.redTeamReview.analysis);
    addSection('Final Verdict', lastResult.verdict.analysis);
  }

  doc.save('ai-war-room-report.pdf');
}
</script>

</body>
</html>
