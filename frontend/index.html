<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI War Room</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #16181d;
  color: #e6e6e6;
  font-family: Arial, Helvetica, sans-serif;
  padding: 40px 20px 80px;
}

.wrap {
  max-width: 760px;
  margin: auto;
}

/* ================= HEADER ================= */

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 32px;
}

header p {
  margin: 0 0 20px;
  color: #9a9a9a;
  font-size: 14px;
  line-height: 1.5;
}

/* ================= BUTTONS ================= */

button {
  font-family: inherit;
}

#historyToggleBtn {
  background: #1f2126;
  border: 1px solid #33363c;
  color: #9db3ff;
  font-weight: 600;
  font-size: 13px;
  padding: 10px 14px;
  border-radius: 6px;
  cursor: pointer;
}

#historyToggleBtn:hover {
  background: #262930;
}

button.run {
  background: #5b8cff;
  color: white;
  border: none;
  font-weight: 600;
  font-size: 14px;
  padding: 12px 22px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 14px;
}

button.run:hover:not(:disabled) {
  background: #4a76e0;
}

button:disabled {
  cursor: not-allowed;
}

/* ================= HISTORY ================= */

#historyPanel {
  display: none;
  background: #1f2126;
  border: 1px solid #33363c;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 20px;
}

#historyPanel h4 {
  margin: 0 0 10px;
  font-size: 14px;
  color: #9db3ff;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#clearHistoryBtn {
  background: none;
  border: none;
  color: #ff6b6b;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
}

#historyList {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 260px;
  overflow-y: auto;
}

.history-item {
  background: #16181d;
  border: 1px solid #2a2d33;
  border-radius: 6px;
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

.history-item:hover {
  border-color: #5b8cff;
}

.history-item-text {
  flex: 1;
  font-size: 13px;
  color: #cfcfcf;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-item-meta {
  font-size: 11px;
  color: #6b7076;
  white-space: nowrap;
}

.history-item-delete {
  background: none;
  border: none;
  color: #6b7076;
  cursor: pointer;
  font-size: 14px;
}

.history-item-delete:hover {
  color: #ff6b6b;
}

.history-empty {
  color: #6b7076;
  font-size: 13px;
}

/* ================= INPUT ================= */

textarea {
  width: 100%;
  min-height: 90px;
  background: #1f2126;
  border: 1px solid #33363c;
  color: #e6e6e6;
  font-family: inherit;
  font-size: 14px;
  padding: 12px;
  border-radius: 6px;
  resize: vertical;
}

textarea:focus {
  outline: none;
  border-color: #5b8cff;
}

textarea::placeholder {
  color: #666;
}

/* ================= MODE ================= */

.mode-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.mode-btn {
  flex: 1;
  background: #1f2126;
  border: 1px solid #33363c;
  color: #9a9a9a;
  font-weight: 600;
  font-size: 13px;
  padding: 12px;
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
}

.mode-btn small {
  display: block;
  font-weight: normal;
  color: #6b7076;
  margin-top: 3px;
}

.mode-btn.active {
  border-color: #5b8cff;
  background: #1e2a4a;
  color: white;
}

.mode-btn.active small {
  color: #9db3ff;
}

/* ================= DOWNLOAD ================= */

#downloadBtn {
  display: none;
  background: #2d3138;
  color: #e6e6e6;
  border: none;
  font-weight: 600;
  font-size: 14px;
  padding: 12px 22px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 14px;
  margin-left: 8px;
}

#downloadBtn:hover {
  background: #383d45;
}

/* ================= LOADING ================= */

#loading {
  display: none;
  color: #9a9a9a;
  font-size: 13px;
  margin-top: 14px;
}

#loading::before {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  background: #5b8cff;
  border-radius: 50%;
  margin-right: 8px;
  animation: pulse 1s infinite ease-in-out;
}

@keyframes pulse {
  0%,100% {
    opacity: .3;
  }

  50% {
    opacity: 1;
  }
}

/* ================= RESULT CARDS ================= */

.card {
  background: #1f2126;
  border: 1px solid #33363c;
  border-radius: 8px;
  padding: 18px 20px;
  margin-top: 14px;
  animation: cardIn .35s ease both;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.result-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.result-header h3 {
  margin: 0;
  font-size: 15px;
  color: #5b8cff;
}

.result-icon {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.card-body {
  font-size: 13px;
  line-height: 1.7;
  color: #cfcfcf;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

/* Individual SVG colors */

.analysis-card .result-icon {
  color: #5b8cff;
}

.solution-card .result-icon {
  color: #8b9eff;
}

.refined-card .result-icon {
  color: #c084fc;
}

.cost-card .result-icon {
  color: #f0b429;
}

.feasibility-card .result-icon {
  color: #4caf7d;
}

.redteam-card .result-icon {
  color: #ff6b6b;
}

/* Verdict */

.card.verdict {
  border-color: #4caf7d;
}

.card.verdict .result-header h3,
.card.verdict .result-icon {
  color: #4caf7d;
}

/* ================= FOLLOW UP ================= */

#followupSection {
  display: none;
  margin-top: 24px;
  border-top: 1px solid #33363c;
  padding-top: 20px;
}

#followupSection h4 {
  font-size: 14px;
  color: #9db3ff;
  margin: 0 0 10px;
}

#chatLog {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
}

.chat-q {
  background: #1e2a4a;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: #cfd8ff;
  align-self: flex-end;
  max-width: 85%;
}

.chat-a {
  background: #1f2126;
  border: 1px solid #33363c;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: #cfcfcf;
  white-space: pre-wrap;
  align-self: flex-start;
  max-width: 90%;
}

.followup-row {
  display: flex;
  gap: 8px;
}

#followupInput {
  flex: 1;
  background: #1f2126;
  border: 1px solid #33363c;
  color: white;
  font-family: inherit;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 6px;
}

#followupInput:focus {
  outline: none;
  border-color: #5b8cff;
}

#askBtn {
  background: #5b8cff;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
}

#askBtn:hover:not(:disabled) {
  background: #4a76e0;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

  body {
    padding: 25px 12px 60px;
  }

  .header-row {
    flex-direction: column;
  }

  #historyToggleBtn {
    width: 100%;
  }

  .mode-row {
    flex-direction: column;
  }

  .followup-row {
    flex-direction: column;
  }

  #askBtn {
    width: 100%;
  }

  #downloadBtn {
    margin-left: 0;
    width: 100%;
  }

  button.run {
    width: 100%;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- ================= HEADER ================= -->

  <div class="header-row">

    <header>
      <h1>AI War Room</h1>

      <p>
        Type a problem below. Multiple AI agents will analyze,
        propose, critique, and judge solutions.
      </p>
    </header>

    <button
      id="historyToggleBtn"
      onclick="toggleHistoryPanel()">
      History
    </button>

  </div>

  <!-- ================= HISTORY ================= -->

  <div id="historyPanel">

    <h4>
      <span>Past runs</span>

      <button
        id="clearHistoryBtn"
        onclick="clearHistory()">
        Clear all
      </button>
    </h4>

    <div id="historyList"></div>

  </div>

  <!-- ================= PROBLEM ================= -->

  <textarea
    id="problemInput"
    placeholder="e.g. How do we reduce food delivery time in a city with heavy traffic?"></textarea>

  <!-- ================= MODE ================= -->

  <div class="mode-row">

    <button
      class="mode-btn"
      id="quickBtn"
      onclick="setMode('quick')">

      Quick

      <small>
        4 agents · faster
      </small>

    </button>

    <button
      class="mode-btn active"
      id="fullBtn"
      onclick="setMode('full')">

      Full

      <small>
        8 agents · thorough
      </small>

    </button>

  </div>

  <!-- ================= ACTIONS ================= -->

  <button
    class="run"
    id="runBtn"
    onclick="runWarRoom()">

    Run War Room

  </button>

  <button
    id="downloadBtn"
    onclick="downloadPDF()">

    Download PDF

  </button>

  <div id="loading">
    Running agents...
  </div>

  <!-- ================= RESULTS ================= -->

  <div id="results"></div>

  <!-- ================= FOLLOW UP ================= -->

  <div id="followupSection">

    <h4>
      Ask a follow-up
    </h4>

    <div id="chatLog"></div>

    <div class="followup-row">

      <input
        id="followupInput"
        type="text"
        placeholder="e.g. Why did Solution B lose?">

      <button
        id="askBtn"
        onclick="askFollowUp()">

        Ask

      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let currentMode = "full";
let lastResult = null;
let lastProblem = "";
let currentHistoryId = null;

const HISTORY_KEY = "aiWarRoomHistory";
const MAX_HISTORY_ITEMS = 30;


/* =========================================================
   SVG ICONS
========================================================= */

const ICONS = {

  analysis: `
    <svg class="result-icon" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="M20 20l-4-4"></path>
      <path d="M8 11h6"></path>
      <path d="M11 8v6"></path>
    </svg>
  `,

  solution: `
    <svg class="result-icon" viewBox="0 0 24 24">
      <path d="M9 18h6"></path>
      <path d="M10 22h4"></path>
      <path d="M8 14.5a7 7 0 1 1 8 0c-1.2.8-2 1.7-2 3.5h-4c0-1.8-.8-2.7-2-3.5z"></path>
    </svg>
  `,

  refined: `
    <svg class="result-icon" viewBox="0 0 24 24">
      <path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3z"></path>
      <path d="M19 3v4"></path>
      <path d="M21 5h-4"></path>
    </svg>
  `,

  cost: `
    <svg class="result-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M15 8.5c-.7-.7-1.7-1-3-1-1.7 0-3 .9-3 2.2 0 1.4 1.2 1.9 3 2.3 1.8.4 3 1 3 2.4 0 1.4-1.3 2.3-3.1 2.3-1.4 0-2.5-.4-3.3-1.2"></path>
      <path d="M12 6v12"></path>
    </svg>
  `,

  feasibility: `
    <svg class="result-icon" viewBox="0 0 24 24">
      <path d="M4 20V10"></path>
      <path d="M10 20V4"></path>
      <path d="M16 20v-7"></path>
      <path d="M22 20H2"></path>
    </svg>
  `,

  redteam: `
    <svg class="result-icon" viewBox="0 0 24 24">
      <path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7l8-4z"></path>
      <path d="M9 9l6 6"></path>
      <path d="M15 9l-6 6"></path>
    </svg>
  `,

  verdict: `
    <svg class="result-icon" viewBox="0 0 24 24">
      <path d="M8 4h8"></path>
      <path d="M12 4v12"></path>
      <path d="M7 20h10"></path>
      <path d="M6 8h12"></path>
      <path d="M5 8l-3 5h6L5 8z"></path>
      <path d="M19 8l-3 5h6l-3-5z"></path>
    </svg>
  `
};


/* =========================================================
   MODE
========================================================= */

function setMode(mode) {

  currentMode = mode;

  document
    .getElementById("quickBtn")
    .classList.toggle("active", mode === "quick");

  document
    .getElementById("fullBtn")
    .classList.toggle("active", mode === "full");
}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   GET AGENT TEXT
========================================================= */

function getAgentText(agent) {

  if (!agent) {
    return "No result returned.";
  }

  if (typeof agent === "string") {
    return agent;
  }

  if (typeof agent.analysis === "string") {
    return agent.analysis;
  }

  return JSON.stringify(agent, null, 2);
}


/* =========================================================
   CREATE RESULT CARD
========================================================= */

function createCard(icon, title, content, className = "") {

  return `
    <div class="card ${className}">

      <div class="result-header">

        ${icon}

        <h3>
          ${escapeHTML(title)}
        </h3>

      </div>

      <div class="card-body">
        ${escapeHTML(content)}
      </div>

    </div>
  `;
}


/* =========================================================
   RENDER RESULTS (used for history playback)
========================================================= */

function renderResults(data) {

  const results =
    document.getElementById("results");

  if (!data) {

    results.innerHTML = createCard(
      ICONS.analysis,
      "Error",
      "No data was returned from the server.",
      "analysis-card"
    );

    return;
  }

  let html = "";

  /* Problem Analysis */

  html += createCard(
    ICONS.analysis,
    "Problem Analysis",
    getAgentText(data.analysis),
    "analysis-card"
  );


  /* Solution A */

  html += createCard(
    ICONS.solution,
    "Solution A",
    getAgentText(data.solutionA),
    "solution-card"
  );


  /* Refined Solution */

  html += createCard(
    ICONS.refined,
    "Refined Winning Solution",
    getAgentText(data.refined),
    "refined-card"
  );


  /* Full Mode */

  if (data.mode === "full") {

    html += createCard(
      ICONS.solution,
      "Solution B",
      getAgentText(data.solutionB),
      "solution-card"
    );

    html += createCard(
      ICONS.cost,
      "Cost Critique",
      getAgentText(data.costReview),
      "cost-card"
    );

    html += createCard(
      ICONS.feasibility,
      "Feasibility Critique",
      getAgentText(data.feasibilityReview),
      "feasibility-card"
    );

    html += createCard(
      ICONS.redteam,
      "Red Team Review",
      getAgentText(data.redTeamReview),
      "redteam-card"
    );

    html += createCard(
      ICONS.verdict,
      "Final Verdict",
      getAgentText(data.verdict),
      "verdict"
    );
  }


  results.innerHTML = html;
}


/* =========================================================
   HISTORY - LOAD
========================================================= */

function loadHistoryFromStorage() {

  try {

    const raw =
      localStorage.getItem(HISTORY_KEY);

    return raw ? JSON.parse(raw) : [];

  } catch (error) {

    console.error(
      "Failed to load history:",
      error
    );

    return [];
  }
}


/* =========================================================
   HISTORY - SAVE
========================================================= */

function saveHistoryToStorage(history) {

  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history)
    );

  } catch (error) {

    console.error(
      "Failed to save history:",
      error
    );
  }
}


/* =========================================================
   SAVE RUN
========================================================= */

function saveRunToHistory(problem, result) {

  const history =
    loadHistoryFromStorage();

  const entry = {

    id: Date.now(),

    problem: problem,

    result: result,

    chatLog: [],

    timestamp:
      new Date().toISOString()
  };

  history.unshift(entry);

  if (history.length > MAX_HISTORY_ITEMS) {

    history.length =
      MAX_HISTORY_ITEMS;
  }

  saveHistoryToStorage(history);

  renderHistory();

  return entry.id;
}


/* =========================================================
   TIMESTAMP
========================================================= */

function formatTimestamp(iso) {

  const date = new Date(iso);

  const now = new Date();

  const sameDay =
    date.toDateString() ===
    now.toDateString();

  const time =
    date.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit"
    });

  if (sameDay) {
    return time;
  }

  return (
    date.toLocaleDateString([], {
      month: "short",
      day: "numeric"
    })
    + " "
    + time
  );
}


/* =========================================================
   RENDER HISTORY
========================================================= */

function renderHistory() {

  const history =
    loadHistoryFromStorage();

  const list =
    document.getElementById(
      "historyList"
    );

  if (history.length === 0) {

    list.innerHTML =
      `<div class="history-empty">
        No past runs yet.
      </div>`;

    return;
  }

  list.innerHTML = "";

  history.forEach(entry => {

    const item =
      document.createElement("div");

    item.className =
      "history-item";

    item.onclick = () =>
      loadHistoryItem(entry.id);


    const text =
      document.createElement("div");

    text.className =
      "history-item-text";

    text.textContent =
      entry.problem;


    const meta =
      document.createElement("div");

    meta.className =
      "history-item-meta";

    meta.textContent =
      formatTimestamp(entry.timestamp);


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "history-item-delete";

    deleteButton.textContent =
      "×";

    deleteButton.onclick = event => {

      event.stopPropagation();

      deleteHistoryItem(entry.id);
    };


    item.appendChild(text);

    item.appendChild(meta);

    item.appendChild(deleteButton);

    list.appendChild(item);
  });
}


/* =========================================================
   LOAD HISTORY ITEM
========================================================= */

function loadHistoryItem(id) {

  const history =
    loadHistoryFromStorage();

  const entry =
    history.find(item =>
      item.id === id
    );

  if (!entry) {
    return;
  }

  currentHistoryId = id;

  lastResult = entry.result;

  lastProblem = entry.problem;

  currentMode =
    entry.result.mode || "full";

  setMode(currentMode);

  document.getElementById(
    "problemInput"
  ).value = entry.problem;

  renderResults(entry.result);


  const chatLog =
    document.getElementById(
      "chatLog"
    );

  chatLog.innerHTML = "";


  (entry.chatLog || []).forEach(message => {

    const div =
      document.createElement("div");

    div.className =
      message.role === "q"
        ? "chat-q"
        : "chat-a";

    div.textContent =
      message.text;

    chatLog.appendChild(div);
  });


  document.getElementById(
    "downloadBtn"
  ).style.display =
    "inline-block";


  document.getElementById(
    "followupSection"
  ).style.display =
    "block";


  document.getElementById(
    "historyPanel"
  ).style.display =
    "none";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================================================
   DELETE HISTORY
========================================================= */

function deleteHistoryItem(id) {

  let history =
    loadHistoryFromStorage();

  history =
    history.filter(
      item => item.id !== id
    );

  saveHistoryToStorage(history);

  renderHistory();

  if (currentHistoryId === id) {

    currentHistoryId = null;
  }
}


/* =========================================================
   CLEAR HISTORY
========================================================= */

function clearHistory() {

  if (
    !confirm(
      "Delete all saved runs from this browser?"
    )
  ) {
    return;
  }

  localStorage.removeItem(
    HISTORY_KEY
  );

  currentHistoryId = null;

  renderHistory();
}


/* =========================================================
   TOGGLE HISTORY
========================================================= */

function toggleHistoryPanel() {

  const panel =
    document.getElementById(
      "historyPanel"
    );

  const open =
    panel.style.display === "block";

  panel.style.display =
    open ? "none" : "block";

  if (!open) {
    renderHistory();
  }
}


/* =========================================================
   UPDATE CHAT HISTORY
========================================================= */

function updateCurrentHistoryChatLog() {

  if (currentHistoryId === null) {
    return;
  }

  const history =
    loadHistoryFromStorage();

  const entry =
    history.find(item =>
      item.id === currentHistoryId
    );

  if (!entry) {
    return;
  }

  const chatLog =
    document.getElementById(
      "chatLog"
    );

  entry.chatLog =
    Array.from(chatLog.children)
      .map(div => ({

        role:
          div.classList.contains(
            "chat-q"
          )
            ? "q"
            : "a",

        text:
          div.textContent
      }));

  saveHistoryToStorage(history);
}


/* =========================================================
   EVENT -> CARD METADATA (for live streaming)
========================================================= */

const EVENT_CARD_MAP = {
  analysis:          { icon: ICONS.analysis,    title: "Problem Analysis",         className: "analysis-card" },
  solutionA:         { icon: ICONS.solution,    title: "Solution A",               className: "solution-card" },
  solutionB:         { icon: ICONS.solution,    title: "Solution B",               className: "solution-card" },
  costReview:        { icon: ICONS.cost,        title: "Cost Critique",            className: "cost-card" },
  feasibilityReview: { icon: ICONS.feasibility, title: "Feasibility Critique",     className: "feasibility-card" },
  verdict:           { icon: ICONS.verdict,     title: "Final Verdict",            className: "verdict" },
  refined:           { icon: ICONS.refined,     title: "Refined Winning Solution", className: "refined-card" },
  redTeamReview:     { icon: ICONS.redteam,     title: "Red Team Review",          className: "redteam-card" }
};

const STATUS_AFTER = {
  analysis:          "Generating Solution A...",
  solutionA:         mode => mode === "quick" ? "Refining the solution..." : "Generating Solution B...",
  solutionB:         "Running cost critique...",
  costReview:        "Running feasibility critique...",
  feasibilityReview: "Judge weighing both solutions...",
  verdict:           "Refining the winning solution...",
  refined:           "Red Team attacking the solution...",
  redTeamReview:     "Finalizing report..."
};


/* =========================================================
   PARSE ONE SSE FRAME
========================================================= */

function parseSSEFrame(frame) {

  let eventName = "message";
  let dataLines = [];

  frame.split("\n").forEach(line => {

    if (line.startsWith("event:")) {
      eventName = line.slice(6).trim();
    } else if (line.startsWith("data:")) {
      dataLines.push(line.slice(5).trim());
    }
  });

  let data = null;

  try {
    data = JSON.parse(dataLines.join("\n"));
  } catch {
    data = dataLines.join("\n");
  }

  return { eventName, data };
}


/* =========================================================
   RUN WAR ROOM (STREAMING)
========================================================= */

async function runWarRoom() {

  const problem =
    document.getElementById(
      "problemInput"
    ).value.trim();

  if (!problem) {

    alert(
      "Please enter a problem first."
    );

    return;
  }

  const runButton =
    document.getElementById("runBtn");

  const downloadButton =
    document.getElementById("downloadBtn");

  const loading =
    document.getElementById("loading");

  const results =
    document.getElementById("results");

  const followup =
    document.getElementById("followupSection");

  const chatLog =
    document.getElementById("chatLog");

  runButton.disabled = true;
  downloadButton.style.display = "none";
  followup.style.display = "none";
  chatLog.innerHTML = "";
  results.innerHTML = "";
  loading.style.display = "block";
  loading.textContent = "Analyzing the problem...";
  currentHistoryId = null;

  let finalResult = null;
  let hadError = false;

  try {

    const response =
      await fetch("/api/run-stream", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          problem: problem,
          mode: currentMode
        })
      });

    if (!response.ok || !response.body) {
      throw new Error("Could not connect to the server.");
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {

      const { done, value } = await reader.read();

      if (done) {
        break;
      }

      buffer += decoder.decode(value, { stream: true });

      let boundary;

      while ((boundary = buffer.indexOf("\n\n")) !== -1) {

        const frame = buffer.slice(0, boundary);

        buffer = buffer.slice(boundary + 2);

        if (!frame.trim()) {
          continue;
        }

        const { eventName, data } =
          parseSSEFrame(frame);

        if (eventName === "error") {

          hadError = true;

          results.innerHTML = createCard(
            ICONS.analysis,
            "Error",
            (data && data.error) ||
              "Something went wrong. Please try again.",
            "analysis-card"
          );

          break;
        }

        if (eventName === "done") {
          finalResult = data;
          continue;
        }

        const meta = EVENT_CARD_MAP[eventName];

        if (meta) {

          results.insertAdjacentHTML(
            "beforeend",
            createCard(
              meta.icon,
              meta.title,
              getAgentText(data),
              meta.className
            )
          );
        }

        const nextStatus =
          STATUS_AFTER[eventName];

        if (nextStatus) {

          loading.textContent =
            typeof nextStatus === "function"
              ? nextStatus(currentMode)
              : nextStatus;
        }
      }

      if (hadError) {
        break;
      }
    }

    if (hadError) {
      return;
    }

    if (!finalResult) {
      throw new Error(
        "Stream ended without a result."
      );
    }

    lastResult = finalResult;
    lastProblem = problem;

    downloadButton.style.display = "inline-block";
    followup.style.display = "block";

    currentHistoryId =
      saveRunToHistory(problem, finalResult);

  } catch (error) {

    console.error(error);

    results.innerHTML = createCard(
      ICONS.analysis,
      "Error",
      error.message ||
        "Something went wrong. Please try again.",
      "analysis-card"
    );

  } finally {

    runButton.disabled = false;
    loading.style.display = "none";
  }
}


/* =========================================================
   FOLLOW-UP
========================================================= */

async function askFollowUp() {

  const input =
    document.getElementById(
      "followupInput"
    );

  const question =
    input.value.trim();


  if (!question || !lastResult) {
    return;
  }


  const askButton =
    document.getElementById(
      "askBtn"
    );

  const chatLog =
    document.getElementById(
      "chatLog"
    );


  const questionDiv =
    document.createElement("div");

  questionDiv.className =
    "chat-q";

  questionDiv.textContent =
    question;

  chatLog.appendChild(
    questionDiv
  );


  const answerDiv =
    document.createElement("div");

  answerDiv.className =
    "chat-a";

  answerDiv.textContent =
    "Thinking...";

  chatLog.appendChild(
    answerDiv
  );


  input.value = "";

  askButton.disabled = true;


  const context = {

    problem:
      lastProblem,

    analysis:
      getAgentText(
        lastResult.analysis
      ),

    solutionA:
      getAgentText(
        lastResult.refined
      ),

    solutionB:
      lastResult.mode === "full"
        ? getAgentText(
            lastResult.solutionB
          )
        : null,

    verdict:
      lastResult.mode === "full"
        ? getAgentText(
            lastResult.verdict
          )
        : null
  };


  try {

    const response =
      await fetch(
        "/api/followup",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            context: context,

            question: question
          })
        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Server returned invalid JSON."
      );
    }


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Something went wrong."
      );
    }


    answerDiv.textContent =
      data.answer ||
      "No answer returned.";


  } catch (error) {

    answerDiv.textContent =
      error.message ||
      "Something went wrong.";

  } finally {

    askButton.disabled = false;

    updateCurrentHistoryChatLog();
  }
}


/* =========================================================
   ENTER KEY FOR FOLLOW-UP
========================================================= */

document
  .getElementById("followupInput")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        askFollowUp();
      }
    }
  );


/* =========================================================
   DOWNLOAD PDF
========================================================= */

function downloadPDF() {

  if (!lastResult) {
    return;
  }


  if (
    !window.jspdf ||
    !window.jspdf.jsPDF
  ) {

    alert(
      "PDF library could not be loaded."
    );

    return;
  }


  const { jsPDF } =
    window.jspdf;


  const doc =
    new jsPDF();


  const pageWidth =
    doc.internal.pageSize.getWidth();


  const pageHeight =
    doc.internal.pageSize.getHeight();


  const margin = 15;

  const maxWidth =
    pageWidth - margin * 2;


  let y = 20;


  function ensureSpace(height) {

    if (
      y + height >
      pageHeight - 15
    ) {

      doc.addPage();

      y = 20;
    }
  }


  function addSection(
    title,
    text
  ) {

    text =
      text || "No result.";


    ensureSpace(20);


    doc.setFont(
      "helvetica",
      "bold"
    );

    doc.setFontSize(13);

    doc.text(
      title,
      margin,
      y
    );

    y += 8;


    doc.setFont(
      "helvetica",
      "normal"
    );

    doc.setFontSize(10);


    const lines =
      doc.splitTextToSize(
        String(text),
        maxWidth
      );


    lines.forEach(line => {

      ensureSpace(6);

      doc.text(
        line,
        margin,
        y
      );

      y += 5.5;
    });


    y += 8;
  }


  doc.setFont(
    "helvetica",
    "bold"
  );

  doc.setFontSize(18);

  doc.text(
    "AI War Room Report",
    margin,
    y
  );

  y += 10;


  doc.setFont(
    "helvetica",
    "italic"
  );

  doc.setFontSize(11);


  const problemLines =
    doc.splitTextToSize(
      "Problem: " +
      lastProblem,
      maxWidth
    );


  problemLines.forEach(line => {

    ensureSpace(6);

    doc.text(
      line,
      margin,
      y
    );

    y += 6;
  });


  y += 6;


  addSection(
    "Problem Analysis",
    getAgentText(
      lastResult.analysis
    )
  );


  addSection(
    "Solution A",
    getAgentText(
      lastResult.solutionA
    )
  );


  addSection(
    "Refined Winning Solution",
    getAgentText(
      lastResult.refined
    )
  );


  if (
    lastResult.mode ===
    "full"
  ) {

    addSection(
      "Solution B",
      getAgentText(
        lastResult.solutionB
      )
    );


    addSection(
      "Cost Critique",
      getAgentText(
        lastResult.costReview
      )
    );


    addSection(
      "Feasibility Critique",
      getAgentText(
        lastResult.feasibilityReview
      )
    );


    addSection(
      "Red Team Review",
      getAgentText(
        lastResult.redTeamReview
      )
    );


    addSection(
      "Final Verdict",
      getAgentText(
        lastResult.verdict
      )
    );
  }


  doc.save(
    "ai-war-room-report.pdf"
  );
}
