<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI War Room</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    max-width: 800px;
    margin: 40px auto;
    padding: 0 20px;
  }
  h1 {
    color: #4fc3f7;
  }
  textarea {
    width: 100%;
    height: 80px;
    padding: 10px;
    font-size: 16px;
    border-radius: 6px;
    border: none;
    margin-bottom: 10px;
  }
  button {
    background: #4fc3f7;
    color: #111;
    border: none;
    padding: 12px 20px;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
  }
  button:disabled {
    background: #555;
    cursor: not-allowed;
  }
  .card {
    background: #1e1e1e;
    border-radius: 8px;
    padding: 15px;
    margin-top: 15px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .card h3 {
    margin-top: 0;
    color: #4fc3f7;
  }
  #loading {
    margin-top: 15px;
    color: #aaa;
  }
</style>
</head>
<body>

<h1>🏛️ AI War Room</h1>
<p>Type a problem below. Multiple AI agents will analyze, propose, critique, and judge solutions.</p>

<textarea id="problemInput" placeholder="e.g. How do we reduce food delivery time in a city with heavy traffic?"></textarea>
<br>
<button id="runBtn" onclick="runWarRoom()">Run War Room</button>

<div id="loading" style="display:none;">Running agents... this may take 30-60 seconds ⏳</div>
<div id="results"></div>

<script>
async function runWarRoom() {
  const problem = document.getElementById('problemInput').value;
  if (!problem.trim()) {
    alert('Please enter a problem first.');
    return;
  }

  const btn = document.getElementById('runBtn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');

  btn.disabled = true;
  loading.style.display = 'block';
  results.innerHTML = '';

  try {
    const response = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ problem })
    });

    const data = await response.json();

    results.innerHTML = `
      <div class="card"><h3>🧩 Problem Analysis</h3>${data.analysis.analysis}</div>
      <div class="card"><h3>💡 Solution A</h3>${data.solutionA.analysis}</div>
      <div class="card"><h3>💡 Solution B</h3>${data.solutionB.analysis}</div>
      <div class="card"><h3>✨ Refined Solution A</h3>${data.refinedA.analysis}</div>
      <div class="card"><h3>💰 Cost Critique (on B)</h3>${data.costReview.analysis}</div>
      <div class="card"><h3>🔧 Feasibility Critique (on B)</h3>${data.feasibilityReview.analysis}</div>
      <div class="card"><h3>⚔️ Red Team (on B)</h3>${data.redTeamReview.analysis}</div>
      <div class="card"><h3>⚖️ Final Verdict</h3>${data.verdict.analysis}</div>
    `;
  } catch (err) {
    results.innerHTML = '<div class="card">Something went wrong. Check the server terminal for errors.</div>';
    console.error(err);
  } finally {
    btn.disabled = false;
    loading.style.display = 'none';
  }
}
</script>

</body>
</html>
