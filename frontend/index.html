<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI War Room</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #16181d;
  color: #e6e6e6;
  font-family: Arial, Helvetica, sans-serif;
  padding: 40px 20px 80px;
}

.wrap {
  max-width: 760px;
  margin: auto;
}

/* ================= HEADER ================= */

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 15px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 32px;
}

header p {
  margin: 0 0 20px;
  color: #9a9a9a;
  font-size: 14px;
  line-height: 1.5;
}

/* ================= BUTTONS ================= */

button {
  font-family: inherit;
}

#historyToggleBtn {
  background: #1f2126;
  border: 1px solid #33363c;
  color: #9db3ff;
  font-weight: 600;
  font-size: 13px;
  padding: 10px 14px;
  border-radius: 6px;
  cursor: pointer;
}

#historyToggleBtn:hover {
  background: #262930;
}

button.run {
  background: #5b8cff;
  color: white;
  border: none;
  font-weight: 600;
  font-size: 14px;
  padding: 12px 22px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 14px;
}

button.run:hover:not(:disabled) {
  background: #4a76e0;
}

button:disabled {
  cursor: not-allowed;
  opacity: .65;
}

/* ================= HISTORY ================= */

#historyPanel {
  display: none;
  background: #1f2126;
  border: 1px solid #33363c;
  border-radius: 8px;
  padding: 14px 16px;
  margin-bottom: 20px;
}

#historyPanel h4 {
  margin: 0 0 10px;
  font-size: 14px;
  color: #9db3ff;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#clearHistoryBtn {
  background: none;
  border: none;
  color: #ff6b6b;
  font-size: 12px;
  cursor: pointer;
  font-weight: 600;
}

#historyList {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 260px;
  overflow-y: auto;
}

.history-item {
  background: #16181d;
  border: 1px solid #2a2d33;
  border-radius: 6px;
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
}

.history-item:hover {
  border-color: #5b8cff;
}

.history-item-text {
  flex: 1;
  font-size: 13px;
  color: #cfcfcf;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-item-meta {
  font-size: 11px;
  color: #6b7076;
  white-space: nowrap;
}

.history-item-delete {
  background: none;
  border: none;
  color: #6b7076;
  cursor: pointer;
  font-size: 14px;
}

.history-item-delete:hover {
  color: #ff6b6b;
}

.history-empty {
  color: #6b7076;
  font-size: 13px;
}

/* ================= INPUT ================= */

textarea {
  width: 100%;
  min-height: 90px;
  background: #1f2126;
  border: 1px solid #33363c;
  color: #e6e6e6;
  font-family: inherit;
  font-size: 14px;
  padding: 12px;
  border-radius: 6px;
  resize: vertical;
}

textarea:focus {
  outline: none;
  border-color: #5b8cff;
}

textarea::placeholder {
  color: #666;
}

/* ================= MODE ================= */

.mode-row {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

.mode-btn {
  flex: 1;
  background: #1f2126;
  border: 1px solid #33363c;
  color: #9a9a9a;
  font-weight: 600;
  font-size: 13px;
  padding: 12px;
  border-radius: 6px;
  cursor: pointer;
  text-align: left;
}

.mode-btn small {
  display: block;
  font-weight: normal;
  color: #6b7076;
  margin-top: 3px;
}

.mode-btn.active {
  border-color: #5b8cff;
  background: #1e2a4a;
  color: white;
}

.mode-btn.active small {
  color: #9db3ff;
}

/* ================= DOWNLOAD ================= */

#downloadBtn {
  display: none;
  background: #2d3138;
  color: #e6e6e6;
  border: none;
  font-weight: 600;
  font-size: 14px;
  padding: 12px 22px;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 14px;
  margin-left: 8px;
}

#downloadBtn:hover {
  background: #383d45;
}

/* ================= MEMORY BADGE ================= */

#memoryBadge {
  display: none;
  background: #1e2a4a;
  border: 1px solid #3d5aa8;
  color: #9db3ff;
  font-size: 12px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 6px;
  margin-top: 14px;
}

/* ================= LOADING ================= */

#loading {
  display: none;
  color: #9a9a9a;
  font-size: 13px;
  margin-top: 14px;
}

/* ================= PIPELINE ================= */

.pipeline-tracker {
  display: none;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.pipeline-step {
  display: flex;
  align-items: center;
  gap: 6px;
  background: #1f2126;
  border: 1px solid #33363c;
  color: #6b7076;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 20px;
  transition: all .25s ease;
}

.pipeline-step .dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #444a52;
  flex-shrink: 0;
}

.pipeline-step.active {
  border-color: #5b8cff;
  color: #9db3ff;
}

.pipeline-step.active .dot {
  background: #5b8cff;
  animation: pulse 1s infinite ease-in-out;
}

.pipeline-step.done {
  border-color: #4caf7d;
  color: #4caf7d;
}

.pipeline-step.done .dot {
  background: #4caf7d;
  animation: none;
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }

  50% {
    opacity: .35;
  }
}

/* ================= CARDS ================= */

.card {
  background: #1f2126;
  border: 1px solid #33363c;
  border-radius: 8px;
  padding: 18px 20px;
  margin-top: 14px;
  animation: cardIn .35s ease both;
}

@keyframes cardIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.result-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.result-header h3 {
  margin: 0;
  font-size: 15px;
  color: #5b8cff;
}

.result-icon {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.analysis-card .result-icon {
  color: #5b8cff;
}

.solution-card .result-icon {
  color: #8b9eff;
}

.refined-card .result-icon {
  color: #c084fc;
}

.cost-card .result-icon {
  color: #f0b429;
}

.feasibility-card .result-icon {
  color: #4caf7d;
}

.redteam-card .result-icon {
  color: #ff6b6b;
}

/* ================= VERDICT ================= */

.card.verdict {
  border-color: #4caf7d;
}

.card.verdict .result-header h3,
.card.verdict .result-icon {
  color: #4caf7d;
}

/* ================= DEBATE STYLE ================= */

.style-row {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.style-btn {
  flex: 1;
  min-width: 100px;
  background: #1f2126;
  border: 1px solid #33363c;
  color: #9a9a9a;
  font-weight: 600;
  font-size: 12px;
  padding: 9px;
  border-radius: 6px;
  cursor: pointer;
}

.style-btn:hover {
  border-color: #8b5cf6;
  color: #d9b3ff;
}

.style-btn.active {
  border-color: #c084fc;
  background: #2a1e3d;
  color: #d9b3ff;
}

/* ================= CONFIDENCE ================= */

#confidenceMeter {
  display: none;
  margin-top: 16px;
}

.meter-labels {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 6px;
}

.meter-labels .a-label {
  color: #9db3ff;
}

.meter-labels .b-label {
  color: #ff9d9d;
}

.meter-bar {
  display: flex;
  height: 10px;
  border-radius: 6px;
  overflow: hidden;
  background: #1f2126;
  border: 1px solid #33363c;
}

.meter-fill-a {
  background: #5b8cff;
  transition: width .5s ease;
}

.meter-fill-b {
  background: #ff6b6b;
  transition: width .5s ease;
}

/* ================= ROOM ================= */

.room-msg {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin-top: 14px;
  animation: cardIn .3s ease both;
}

.room-msg .room-msg-label {
  font-size: 11px;
  font-weight: 700;
  margin-bottom: 6px;
  opacity: .85;
}

.room-msg.side-a {
  margin-right: auto;
  background: #1e2a4a;
  border: 1px solid #3d5aa8;
  color: #cfd8ff;
}

.room-msg.side-a .room-msg-label {
  color: #9db3ff;
}

.room-msg.side-b {
  margin-left: auto;
  background: #3a1e1e;
  border: 1px solid #a83d3d;
  color: #ffd8c8;
}

.room-msg.side-b .room-msg-label {
  color: #ff9d9d;
}

.room-msg.side-judge {
  max-width: 95%;
  margin: 14px auto;
  background: #16241d;
  border: 1px solid #4caf7d;
  color: #bfe9d3;
}

.room-msg.side-judge .room-msg-label {
  color: #4caf7d;
}

.room-msg.side-system {
  max-width: 95%;
  margin: 14px auto;
  background: #1f2126;
  border: 1px solid #33363c;
  color: #cfcfcf;
}

.room-msg.side-system .room-msg-label {
  color: #5b8cff;
}

/* ================= STREAMING CURSOR ================= */

.room-msg.streaming .card-body::after {
  content: "▋";
  display: inline-block;
  margin-left: 2px;
  animation: blinkCursor .8s infinite;
  opacity: .8;
}

@keyframes blinkCursor {
  0%, 45% {
    opacity: 1;
  }

  46%, 100% {
    opacity: 0;
  }
}

/* ================= SCORECARD ================= */

.scorecard {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 12px;
}

.scorecard th,
.scorecard td {
  padding: 6px 8px;
  text-align: left;
  border-bottom: 1px solid #2a2d33;
}

.scorecard th {
  color: #9db3ff;
  font-weight: 600;
}

.scorecard td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.scorecard tr.total td {
  font-weight: 700;
  color: white;
  border-top: 2px solid #33363c;
}

/* ================= FOLLOW UP ================= */

#followupSection {
  display: none;
  margin-top: 24px;
  border-top: 1px solid #33363c;
  padding-top: 20px;
}

#followupSection h4 {
  font-size: 14px;
  color: #9db3ff;
  margin: 0 0 10px;
}

#chatLog {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
}

.chat-q {
  background: #1e2a4a;
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 13px;
  color: #cfd8ff;
  align-self: flex-end;
  max-width: 85%;
}

.chat-a {
  background: #1f2126;
  border: 1px solid #33363c;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: #cfcfcf;
  white-space: pre-wrap;
  align-self: flex-start;
  max-width: 90%;
}

.followup-row {
  display: flex;
  gap: 8px;
}

#followupInput {
  flex: 1;
  background: #1f2126;
  border: 1px solid #33363c;
  color: white;
  font-family: inherit;
  font-size: 13px;
  padding: 10px 12px;
  border-radius: 6px;
}

#followupInput:focus {
  outline: none;
  border-color: #5b8cff;
}

#askBtn {
  background: #5b8cff;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 6px;
  cursor: pointer;
}

#askBtn:hover:not(:disabled) {
  background: #4a76e0;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

  body {
    padding: 25px 12px 60px;
  }

  .header-row {
    flex-direction: column;
  }

  #historyToggleBtn {
    width: 100%;
  }

  .mode-row {
    flex-direction: column;
  }

  .style-row {
    flex-direction: column;
  }

  .style-btn {
    width: 100%;
  }

  .followup-row {
    flex-direction: column;
  }

  #askBtn {
    width: 100%;
  }

  #downloadBtn {
    margin-left: 0;
    width: 100%;
  }

  button.run {
    width: 100%;
  }

  .room-msg {
    max-width: 95%;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header-row">

    <header>
      <h1>AI War Room</h1>

      <p>
        Type a problem below. Multiple AI agents will analyze,
        propose, critique, and judge solutions.
      </p>
    </header>

    <button id="historyToggleBtn" onclick="toggleHistoryPanel()">
      History
    </button>

  </div>

  <div id="historyPanel">

    <h4>
      <span>Past runs</span>

      <button id="clearHistoryBtn" onclick="clearHistory()">
        Clear all
      </button>
    </h4>

    <div id="historyList"></div>

  </div>

  <textarea
    id="problemInput"
    placeholder="e.g. How do we reduce food delivery time in a city with heavy traffic?"
  ></textarea>

  <div class="style-row" id="styleRow">

    <button
      type="button"
      class="style-btn active"
      data-style="balanced"
      onclick="setDebateStyle('balanced')">
      Balanced
    </button>

    <button
      type="button"
      class="style-btn"
      data-style="aggressive"
      onclick="setDebateStyle('aggressive')">
      Aggressive
    </button>

    <button
      type="button"
      class="style-btn"
      data-style="scientific"
      onclick="setDebateStyle('scientific')">
      Scientific
    </button>

    <button
      type="button"
      class="style-btn"
      data-style="legal"
      onclick="setDebateStyle('legal')">
      Legal
    </button>

  </div>

  <div class="mode-row">

    <button
      class="mode-btn"
      id="quickBtn"
      onclick="setMode('quick')">

      Quick

      <small>
        4 agents · faster
      </small>

    </button>

    <button
      class="mode-btn active"
      id="fullBtn"
      onclick="setMode('full')">

      Full

      <small>
        8 agents · thorough
      </small>

    </button>

  </div>

  <button
    class="run"
    id="runBtn"
    onclick="runWarRoom()">
    Run War Room
  </button>

  <button
    id="downloadBtn"
    onclick="downloadPDF()">
    Download PDF
  </button>

  <div id="loading">
    Running agents...
  </div>

  <div id="pipelineTracker" class="pipeline-tracker"></div>

  <div id="confidenceMeter" aria-label="Live confidence meter">

    <div class="meter-labels">
      <span class="a-label">AI A</span>
      <span class="b-label">AI B</span>
    </div>

    <div class="meter-bar">

      <div
        class="meter-fill-a"
        id="meterFillA"
        style="width:50%">
      </div>

      <div
        class="meter-fill-b"
        id="meterFillB"
        style="width:50%">
      </div>

    </div>

  </div>

  <div id="memoryBadge"></div>

  <div id="results"></div>

  <div id="followupSection">

    <h4>
      Ask a follow-up
    </h4>

    <div id="chatLog"></div>

    <div class="followup-row">

      <input
        id="followupInput"
        type="text"
        placeholder="e.g. Why did Solution B lose?">

      <button
        id="askBtn"
        onclick="askFollowUp()">
        Ask
      </button>

    </div>

  </div>

</div>

<script>

/* =========================================================
   GLOBAL STATE
========================================================= */

let currentMode = "full";
let currentDebateStyle = "balanced";

let confidenceA = 50;
let confidenceB = 50;

let lastResult = null;
let lastProblem = "";
let currentHistoryId = null;

const HISTORY_KEY = "aiWarRoomHistory";
const MAX_HISTORY_ITEMS = 30;


/* =========================================================
   DEBATE STYLE
========================================================= */

function setDebateStyle(style) {

  const allowedStyles = [
    "balanced",
    "aggressive",
    "scientific",
    "legal"
  ];

  currentDebateStyle =
    allowedStyles.includes(style)
      ? style
      : "balanced";

  document
    .querySelectorAll(".style-btn")
    .forEach(btn => {

      btn.classList.toggle(
        "active",
        btn.dataset.style === currentDebateStyle
      );

    });
}


/* =========================================================
   CONFIDENCE
========================================================= */

const CONFIDENCE_NUDGE = {

  solutionA: 0,
  solutionB: 0,

  costReviewA: -4,
  feasibilityReviewA: -4,

  costReviewB: 4,
  feasibilityReviewB: 4,

  rebuttalA: 5,
  rebuttalB: -5,

  crossExamA: 4,
  crossExamB: -4,

  issueResponseA: 3,
  issueResponseB: -3
};

function updateConfidenceMeter() {

  const fillA =
    document.getElementById("meterFillA");

  const fillB =
    document.getElementById("meterFillB");

  if (!fillA || !fillB) return;

  fillA.style.width = confidenceA + "%";
  fillB.style.width = confidenceB + "%";
}

function nudgeConfidence(eventName) {

  const nudge =
    CONFIDENCE_NUDGE[eventName];

  if (nudge === undefined) return;

  confidenceA =
    Math.min(
      85,
      Math.max(
        15,
        confidenceA + nudge
      )
    );

  confidenceB =
    100 - confidenceA;

  updateConfidenceMeter();
}

function resetConfidenceMeter() {

  confidenceA = 50;
  confidenceB = 50;

  updateConfidenceMeter();
}


/* =========================================================
   SVG ICONS
========================================================= */

const ICONS = {

  analysis: `
    <svg
      class="result-icon"
      viewBox="0 0 24 24"
      aria-hidden="true">

      <circle cx="11" cy="11" r="7"></circle>
      <path d="M20 20l-4-4"></path>
      <path d="M8 11h6"></path>
      <path d="M11 8v6"></path>

    </svg>
  `,

  solution: `
    <svg
      class="result-icon"
      viewBox="0 0 24 24"
      aria-hidden="true">

      <path d="M9 18h6"></path>
      <path d="M10 22h4"></path>
      <path d="M8 14.5a7 7 0 1 1 8 0c-1.2.8-2 1.7-2 3.5h-4c0-1.8-.8-2.7-2-3.5z"></path>

    </svg>
  `,

  refined: `
    <svg
      class="result-icon"
      viewBox="0 0 24 24"
      aria-hidden="true">

      <path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3z"></path>
      <path d="M19 3v4"></path>
      <path d="M21 5h-4"></path>

    </svg>
  `,

  cost: `
    <svg
      class="result-icon"
      viewBox="0 0 24 24"
      aria-hidden="true">

      <circle cx="12" cy="12" r="9"></circle>
      <path d="M15 8.5c-.7-.7-1.7-1-3-1-1.7 0-3 .9-3 2.2 0 1.4 1.2 1.9 3 2.3 1.8.4 3 1 3 2.4 0 1.4-1.3 2.3-3.1 2.3-1.4 0-2.5-.4-3.3-1.2"></path>
      <path d="M12 6v12"></path>

    </svg>
  `,

  feasibility: `
    <svg
      class="result-icon"
      viewBox="0 0 24 24"
      aria-hidden="true">

      <path d="M4 20V10"></path>
      <path d="M10 20V4"></path>
      <path d="M16 20v-7"></path>
      <path d="M22 20H2"></path>

    </svg>
  `,

  redteam: `
    <svg
      class="result-icon"
      viewBox="0 0 24 24"
      aria-hidden="true">

      <path d="M12 3l8 4v5c0 5-3.4 8-8 9-4.6-1-8-4-8-9V7l8-4z"></path>
      <path d="M9 9l6 6"></path>
      <path d="M15 9l-6 6"></path>

    </svg>
  `,

  verdict: `
    <svg
      class="result-icon"
      viewBox="0 0 24 24"
      aria-hidden="true">

      <path d="M8 4h8"></path>
      <path d="M12 4v12"></path>
      <path d="M7 20h10"></path>
      <path d="M6 8h12"></path>
      <path d="M5 8l-3 5h6L5 8z"></path>
      <path d="M19 8l-3 5h6l-3-5z"></path>

    </svg>
  `
};


/* =========================================================
   MODE
========================================================= */

function setMode(mode) {

  currentMode =
    mode === "quick"
      ? "quick"
      : "full";

  document
    .getElementById("quickBtn")
    .classList.toggle(
      "active",
      currentMode === "quick"
    );

  document
    .getElementById("fullBtn")
    .classList.toggle(
      "active",
      currentMode === "full"
    );
}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   GET AGENT TEXT
========================================================= */

function getAgentText(agent) {

  if (!agent) {
    return "No result returned.";
  }

  if (typeof agent === "string") {
    return agent;
  }

  if (typeof agent.analysis === "string") {
    return agent.analysis;
  }

  return JSON.stringify(
    agent,
    null,
    2
  );
}


/* =========================================================
   SCORECARD
========================================================= */

function createScorecard(
  breakdown,
  scores
) {

  const isTie =
    scores &&
    scores.A !== null &&
    scores.A !== undefined &&
    scores.B !== null &&
    scores.B !== undefined &&
    Math.abs(
      Number(scores.A) -
      Number(scores.B)
    ) <= 3;

  if (
    !breakdown ||
    !breakdown.solutionA ||
    !breakdown.solutionB
  ) {

    return `
      <div class="card verdict">

        <div class="result-header">
          ${ICONS.verdict}
          <h3>Score Breakdown</h3>
        </div>

        <div class="card-body">
          Scores could not be generated for this run
          because the judge response could not be parsed.
        </div>

      </div>
    `;
  }

  const criteria = [
    "feasibility",
    "practicality",
    "cost",
    "reliability",
    "evidence",
    "scalability",
    "novelty"
  ];

  const rows =
    criteria
      .map(key => {

        const a =
          breakdown.solutionA[key] ?? "-";

        const b =
          breakdown.solutionB[key] ?? "-";

        const label =
          key.charAt(0).toUpperCase() +
          key.slice(1);

        return `
          <tr>
            <td>${escapeHTML(label)}</td>
            <td class="num">${escapeHTML(a)}</td>
            <td class="num">${escapeHTML(b)}</td>
          </tr>
        `;

      })
      .join("");

  const totalA =
    scores &&
    scores.A !== null &&
    scores.A !== undefined
      ? scores.A
      : "-";

  const totalB =
    scores &&
    scores.B !== null &&
    scores.B !== undefined
      ? scores.B
      : "-";

  return `
    <div class="card verdict">

      <div class="result-header">
        ${ICONS.verdict}
        <h3>Score Breakdown</h3>
      </div>

      <div class="card-body">

        <table class="scorecard">

          <thead>
            <tr>
              <th>Criterion</th>
              <th class="num">Solution A</th>
              <th class="num">Solution B</th>
            </tr>
          </thead>

          <tbody>

            ${rows}

            <tr class="total">
              <td>Weighted Total</td>
              <td class="num">${escapeHTML(totalA)}</td>
              <td class="num">${escapeHTML(totalB)}</td>
            </tr>

          </tbody>

        </table>

        ${
          isTie
            ? `
              <p style="margin-top:12px;color:#9db3ff;font-size:12px;">
                ⚖️ Scores are close enough that the Judge
                treated this as too close to call a decisive winner.
              </p>
            `
            : ""
        }

      </div>

    </div>
  `;
}


/* =========================================================
   RESULT CARD
========================================================= */

function createCard(
  icon,
  title,
  content,
  className = ""
) {

  return `
    <div class="card ${escapeHTML(className)}">

      <div class="result-header">
        ${icon}
        <h3>${escapeHTML(title)}</h3>
      </div>

      <div class="card-body">
        ${escapeHTML(content)}
      </div>

    </div>
  `;
}

/* =========================================================
   HISTORY
========================================================= */

function loadHistoryFromStorage() {

  try {

    const raw =
      localStorage.getItem(
        HISTORY_KEY
      );

    return raw
      ? JSON.parse(raw)
      : [];

  } catch (error) {

    console.error(
      "Failed to load history:",
      error
    );

    return [];
  }
}

function saveHistoryToStorage(history) {

  try {

    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(history)
    );

  } catch (error) {

    console.error(
      "Failed to save history:",
      error
    );
  }
}

function saveRunToHistory(
  problem,
  result
) {

  const history =
    loadHistoryFromStorage();

  const entry = {

    id: Date.now(),

    problem,

    result,

    chatLog: [],

    timestamp:
      new Date().toISOString()
  };

  history.unshift(entry);

  if (
    history.length >
    MAX_HISTORY_ITEMS
  ) {
    history.length =
      MAX_HISTORY_ITEMS;
  }

  saveHistoryToStorage(
    history
  );

  renderHistory();

  return entry.id;
}

function formatTimestamp(iso) {

  const date =
    new Date(iso);

  const now =
    new Date();

  const sameDay =
    date.toDateString() ===
    now.toDateString();

  const time =
    date.toLocaleTimeString(
      [],
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  if (sameDay) {
    return time;
  }

  return (
    date.toLocaleDateString(
      [],
      {
        month: "short",
        day: "numeric"
      }
    ) +
    " " +
    time
  );
}

function renderHistory() {

  const history =
    loadHistoryFromStorage();

  const list =
    document.getElementById(
      "historyList"
    );

  if (!history.length) {

    list.innerHTML =
      `
        <div class="history-empty">
          No past runs yet.
        </div>
      `;

    return;
  }

  list.innerHTML = "";

  history.forEach(entry => {

    const item =
      document.createElement("div");

    item.className =
      "history-item";

    item.onclick =
      () =>
        loadHistoryItem(entry.id);

    const text =
      document.createElement("div");

    text.className =
      "history-item-text";

    text.textContent =
      entry.problem;

    const meta =
      document.createElement("div");

    meta.className =
      "history-item-meta";

    meta.textContent =
      formatTimestamp(
        entry.timestamp
      );

    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "history-item-delete";

    deleteButton.textContent =
      "×";

    deleteButton.onclick =
      event => {

        event.stopPropagation();

        deleteHistoryItem(
          entry.id
        );
      };

    item.appendChild(text);
    item.appendChild(meta);
    item.appendChild(deleteButton);

    list.appendChild(item);
  });
}

function loadHistoryItem(id) {

  const history =
    loadHistoryFromStorage();

  const entry =
    history.find(
      item => item.id === id
    );

  if (!entry) return;

  currentHistoryId =
    id;

  lastResult =
    entry.result;

  lastProblem =
    entry.problem;

  currentMode =
    entry.result.mode ||
    "full";

  setMode(currentMode);

  document.getElementById(
    "problemInput"
  ).value =
    entry.problem;

  renderResults(
    entry.result
  );

  updateMemoryBadge(
    entry.result
  );

  const chatLog =
    document.getElementById(
      "chatLog"
    );

  chatLog.innerHTML = "";

  (
    entry.chatLog ||
    []
  ).forEach(message => {

    const div =
      document.createElement("div");

    div.className =
      message.role === "q"
        ? "chat-q"
        : "chat-a";

    div.textContent =
      message.text;

    chatLog.appendChild(div);
  });

  document.getElementById(
    "downloadBtn"
  ).style.display =
    "inline-block";

  document.getElementById(
    "followupSection"
  ).style.display =
    "block";

  document.getElementById(
    "historyPanel"
  ).style.display =
    "none";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function deleteHistoryItem(id) {

  let history =
    loadHistoryFromStorage();

  history =
    history.filter(
      item => item.id !== id
    );

  saveHistoryToStorage(
    history
  );

  renderHistory();

  if (
    currentHistoryId === id
  ) {
    currentHistoryId = null;
  }
}

function clearHistory() {

  if (
    !confirm(
      "Delete all saved runs from this browser?"
    )
  ) {
    return;
  }

  localStorage.removeItem(
    HISTORY_KEY
  );

  currentHistoryId = null;

  renderHistory();
}

function toggleHistoryPanel() {

  const panel =
    document.getElementById(
      "historyPanel"
    );

  const open =
    panel.style.display ===
    "block";

  panel.style.display =
    open
      ? "none"
      : "block";

  if (!open) {
    renderHistory();
  }
}

function updateCurrentHistoryChatLog() {

  if (
    currentHistoryId === null
  ) {
    return;
  }

  const history =
    loadHistoryFromStorage();

  const entry =
    history.find(
      item =>
        item.id ===
        currentHistoryId
    );

  if (!entry) return;

  const chatLog =
    document.getElementById(
      "chatLog"
    );

  entry.chatLog =
    Array.from(
      chatLog.children
    ).map(div => ({

      role:
        div.classList.contains("chat-q")
          ? "q"
          : "a",

      text:
        div.textContent

    }));

  saveHistoryToStorage(
    history
  );
}

/* =========================================================
   STREAMING STATE
========================================================= */

const streamingCardBodies = {};
const streamingQueues = {};
const streamingTimers = {};
const streamingFinalTexts = {};


/* =========================================================
   NORMALIZE STREAM TEXT
========================================================= */

function normalizeStreamText(data) {

  if (
    data === null ||
    data === undefined
  ) {
    return "";
  }

  if (typeof data === "string") {
    return data;
  }

  if (typeof data === "object") {

    if (
      typeof data.delta === "string"
    ) {
      return data.delta;
    }

    if (
      typeof data.text === "string"
    ) {
      return data.text;
    }

    if (
      typeof data.content === "string"
    ) {
      return data.content;
    }

    return JSON.stringify(
      data
    );
  }

  return String(data);
}


/* =========================================================
   ENSURE STREAMING CARD
========================================================= */

function ensureStreamingCard(key) {

  if (
    streamingCardBodies[key]
  ) {
    return streamingCardBodies[key];
  }

  const meta =
    EVENT_CARD_MAP[key];

  if (!meta) {
    return null;
  }

  const results =
    document.getElementById(
      "results"
    );

  const cardId =
    "card-body-" +
    key +
    "-" +
    Date.now();

  results.insertAdjacentHTML(
    "beforeend",

    `
      <div
        class="room-msg side-${escapeHTML(meta.side)}"
        data-stream-key="${escapeHTML(key)}">

        <div class="room-msg-label">
          ${escapeHTML(meta.title)}
        </div>

        <div
          class="card-body"
          id="${escapeHTML(cardId)}">
        </div>

      </div>
    `
  );

  const bodyEl =
    document.getElementById(
      cardId
    );

  if (!bodyEl) {
    return null;
  }

  streamingCardBodies[key] =
    bodyEl;

  streamingQueues[key] =
    [];

  streamingQueues[key].charIndex =
    0;

  streamingTimers[key] =
    null;

  streamingFinalTexts[key] =
    null;

  const message =
    bodyEl.closest(".room-msg");

  if (message) {

    message.classList.add(
      "streaming"
    );

    message.scrollIntoView({
      behavior: "smooth",
      block: "end"
    });
  }

  return bodyEl;
}


/* =========================================================
   SLOW, NATURAL STREAMING TYPING
========================================================= */

function startStreamingTyping(key) {

  const bodyEl =
    streamingCardBodies[key];

  const queue =
    streamingQueues[key];

  if (
    !bodyEl ||
    !queue
  ) {
    return;
  }

  /*
   * CRITICAL:
   * Only ONE timer can exist for each agent.
   */
  if (
    streamingTimers[key] !== null &&
    streamingTimers[key] !== undefined
  ) {
    return;
  }

  function tick() {

    streamingTimers[key] =
      null;

    /*
     * Nothing left to display.
     */
    if (
      queue.length === 0
    ) {

      if (
        streamingFinalTexts[key] !== null &&
        streamingFinalTexts[key] !== undefined
      ) {

        bodyEl.textContent =
          streamingFinalTexts[key];

        streamingFinalTexts[key] =
          null;

        const message =
          bodyEl.closest(".room-msg");

        if (message) {
          message.classList.remove(
            "streaming"
          );
        }
      }

      return;
    }

    let current =
      queue[0];

    if (
      typeof current !== "string"
    ) {
      current =
        String(current);
    }

    if (
      typeof queue.charIndex !==
      "number"
    ) {
      queue.charIndex = 0;
    }

    /*
     * NORMAL:
     * 1 character every 20ms.
     *
     * If the server gets far ahead,
     * increase slightly so the UI
     * doesn't become excessively delayed.
     */
    let charsPerTick = 1;

    const backlog =
      queue.reduce(
        (total, chunk) =>
          total +
          String(chunk).length,
        0
      );

    if (backlog > 2000) {
      charsPerTick = 2;
    }

    const remaining =
      current.length -
      queue.charIndex;

    const amount =
      Math.min(
        charsPerTick,
        remaining
      );

    if (amount > 0) {

      bodyEl.textContent +=
        current.slice(
          queue.charIndex,
          queue.charIndex + amount
        );

      queue.charIndex +=
        amount;
    }

    /*
     * Current chunk completed.
     */
    if (
      queue.charIndex >=
      current.length
    ) {

      queue.shift();

      queue.charIndex = 0;
    }

    /*
     * Keep the newest text visible.
     */
    const message =
      bodyEl.closest(".room-msg");

    if (message) {

      message.scrollIntoView({
        behavior: "auto",
        block: "end"
      });
    }

    /*
     * 20ms = slower, readable typing.
     */
    streamingTimers[key] =
      setTimeout(
        tick,
        20
      );
  }

  /*
   * Start immediately.
   */
  streamingTimers[key] =
    setTimeout(
      tick,
      0
    );
}


/* =========================================================
   APPEND STREAM CHUNK
========================================================= */

function appendToStreamingCard(
  key,
  chunkText
) {

  const bodyEl =
    ensureStreamingCard(key);

  if (!bodyEl) {
    return;
  }

  const text =
    normalizeStreamText(
      chunkText
    );

  if (!text) {
    return;
  }

  if (
    !streamingQueues[key]
  ) {

    streamingQueues[key] =
      [];

    streamingQueues[key].charIndex =
      0;
  }

  streamingQueues[key].push(
    text
  );

  startStreamingTyping(
    key
  );
}


/* =========================================================
   FINALIZE STREAMING CARD
========================================================= */

function finalizeStreamingCard(
  key,
  finalText
) {

  const bodyEl =
    streamingCardBodies[key];

  if (!bodyEl) {
    return;
  }

  const text =
    normalizeStreamText(
      finalText
    );

  /*
   * Store authoritative final text.
   * Never destroy the visual queue.
   */
  streamingFinalTexts[key] =
    text;

  const queue =
    streamingQueues[key];

  if (
    !queue ||
    queue.length === 0
  ) {

    bodyEl.textContent =
      text;

    streamingFinalTexts[key] =
      null;

    const message =
      bodyEl.closest(".room-msg");

    if (message) {
      message.classList.remove(
        "streaming"
      );
    }

    return;
  }

  startStreamingTyping(
    key
  );
}


/* =========================================================
   RESET STREAMING STATE
========================================================= */

function clearStreamingState() {

  Object.keys(
    streamingTimers
  ).forEach(key => {

    if (
      streamingTimers[key] !== null &&
      streamingTimers[key] !== undefined
    ) {

      clearTimeout(
        streamingTimers[key]
      );
    }

  });

  Object.keys(
    streamingCardBodies
  ).forEach(key => {
    delete streamingCardBodies[key];
  });

  Object.keys(
    streamingQueues
  ).forEach(key => {
    delete streamingQueues[key];
  });

  Object.keys(
    streamingTimers
  ).forEach(key => {
    delete streamingTimers[key];
  });

  Object.keys(
    streamingFinalTexts
  ).forEach(key => {
    delete streamingFinalTexts[key];
  });
}


/* =========================================================
   SSE PARSER
========================================================= */

function parseSSEFrame(frame) {

  let eventName =
    "message";

  const dataLines = [];

  frame
    .split("\n")
    .forEach(line => {

      if (
        line.startsWith("event:")
      ) {

        eventName =
          line
            .slice(6)
            .trim();

      } else if (
        line.startsWith("data:")
      ) {

        /*
         * Preserve streamed whitespace.
         */
        dataLines.push(
          line.slice(5)
        );
      }

    });

  const rawData =
    dataLines.join("\n");

  let data;

  try {

    data =
      JSON.parse(
        rawData
      );

  } catch {

    data =
      rawData.startsWith(" ")
        ? rawData.slice(1)
        : rawData;
  }

  return {
    eventName,
    data
  };
}


/* =========================================================
   RUN WAR ROOM
========================================================= */

async function runWarRoom() {

  const problem =
    document
      .getElementById("problemInput")
      .value
      .trim();

  const runButton =
    document.getElementById("runBtn");

  const downloadButton =
    document.getElementById("downloadBtn");

  const loading =
    document.getElementById("loading");

  const results =
    document.getElementById("results");

  const followup =
    document.getElementById("followupSection");

  const chatLog =
    document.getElementById("chatLog");

  if (!problem) {

    alert(
      "Please enter a problem first."
    );

    return;
  }

  runButton.disabled = true;

  downloadButton.style.display =
    "none";

  followup.style.display =
    "none";

  chatLog.innerHTML =
    "";

  results.innerHTML =
    "";

  clearStreamingState();

  resetConfidenceMeter();

  const confidenceMeter =
    document.getElementById(
      "confidenceMeter"
    );

  if (confidenceMeter) {

    confidenceMeter.style.display =
      currentMode === "full"
        ? "block"
        : "none";
  }

  loading.style.display =
    "block";

  loading.textContent =
    "Analyzing the problem...";

  renderPipelineTracker(
    currentMode
  );

  markPipelineStep(
    "analysis",
    "active"
  );

  currentHistoryId =
    null;

  let finalResult = null;
  let hadError = false;

  try {

    const response =
      await fetch(
        "/api/run-stream",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              problem,
              mode: currentMode,
              debateStyle:
                currentDebateStyle
            })
        }
      );

    if (
      !response.ok ||
      !response.body
    ) {

      throw new Error(
        "Could not connect to the server."
      );
    }

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder("utf-8");

    let buffer = "";

    while (true) {

      const {
        done,
        value
      } =
        await reader.read();

      if (done) {
        break;
      }

      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );

      let boundary;

      while (
        (boundary =
          buffer.indexOf("\n\n")) !== -1
      ) {

        const frame =
          buffer.slice(
            0,
            boundary
          );

        buffer =
          buffer.slice(
            boundary + 2
          );

        if (!frame.trim()) {
          continue;
        }

        const {
          eventName,
          data
        } =
          parseSSEFrame(frame);

        /* ================= ERROR ================= */

        if (
          eventName === "error"
        ) {

          hadError = true;

          results.innerHTML =
            createCard(
              ICONS.analysis,
              "Error",
              (
                data &&
                data.error
              ) ||
              "Something went wrong. Please try again.",
              "analysis-card"
            );

          break;
        }

        /* ================= DONE ================= */

        if (
          eventName === "done"
        ) {

          finalResult =
            data;

          continue;
        }

        /* ================= STREAM DELTA ================= */

        if (
          eventName &&
          eventName.endsWith(":delta")
        ) {

          const baseKey =
            eventName.slice(
              0,
              -":delta".length
            );

          appendToStreamingCard(
            baseKey,
            data
          );

          continue;
        }

        /* ================= NORMAL EVENT ================= */

        markPipelineStep(
          eventName,
          "done"
        );

        nudgeConfidence(
          eventName
        );

        /* ================= REAL JUDGE SCORES ================= */

        if (
          eventName === "verdict" &&
          data &&
          data.scores
        ) {

          const scoreA =
            Number(
              data.scores.A
            );

          const scoreB =
            Number(
              data.scores.B
            );

          if (
            Number.isFinite(scoreA) &&
            Number.isFinite(scoreB)
          ) {

            confidenceA =
              Math.max(
                0,
                scoreA
              );

            confidenceB =
              Math.max(
                0,
                scoreB
              );

            const total =
              confidenceA +
              confidenceB;

            if (total > 0) {

              confidenceA =
                (
                  confidenceA /
                  total
                ) * 100;

              confidenceB =
                100 -
                confidenceA;
            }

            updateConfidenceMeter();
          }
        }

        const meta =
          EVENT_CARD_MAP[
            eventName
          ];

        if (meta) {

          if (
            !streamingCardBodies[
              eventName
            ]
          ) {

            ensureStreamingCard(
              eventName
            );
          }

          finalizeStreamingCard(
            eventName,
            getAgentText(data)
          );

          /* Scorecard immediately after verdict */

          if (
            eventName === "verdict"
          ) {

            results.insertAdjacentHTML(
              "beforeend",

              createScorecard(
                data &&
                data.breakdown,

                data &&
                data.scores
              )
            );
          }
        }

        /* ================= NEXT STATUS ================= */

        const nextStatus =
          STATUS_AFTER[
            eventName
          ];

        if (nextStatus) {

          const stepIndex =
            PIPELINE_STEPS.findIndex(
              step =>
                step.key ===
                eventName
            );

          if (
            stepIndex !== -1 &&
            PIPELINE_STEPS[
              stepIndex + 1
            ]
          ) {

            markPipelineStep(
              PIPELINE_STEPS[
                stepIndex + 1
              ].key,
              "active"
            );
          }

          loading.textContent =
            typeof nextStatus === "function"
              ? nextStatus(currentMode)
              : nextStatus;
        }
      }

      if (hadError) {
        break;
      }
    }

    if (hadError) {
      return;
    }

    /*
     * Handle a final frame that does not end
     * with the usual blank line.
     */
    if (buffer.trim()) {

      const {
        eventName,
        data
      } =
        parseSSEFrame(buffer);

      if (
        eventName === "done"
      ) {
        finalResult = data;
      }
    }

    if (!finalResult) {

      throw new Error(
        "Stream ended without a result."
      );
    }

    lastResult =
      finalResult;

    lastProblem =
      problem;

    /*
     * Wait until the visual queues have had
     * time to finish before showing follow-up.
     */
    await waitForStreamingQueues();

    downloadButton.style.display =
      "inline-block";

    followup.style.display =
      "block";

    updateMemoryBadge(
      finalResult
    );

    currentHistoryId =
      saveRunToHistory(
        problem,
        finalResult
      );

  } catch (error) {

    console.error(
      "War Room Error:",
      error
    );

    results.innerHTML =
      createCard(
        ICONS.analysis,
        "Error",
        error.message ||
          "Something went wrong.",
        "analysis-card"
      );

  } finally {

    runButton.disabled =
      false;

    loading.style.display =
      "none";

    markAllPipelineDone();
  }
}


/* =========================================================
   WAIT FOR STREAMING QUEUES
========================================================= */

function waitForStreamingQueues() {

  return new Promise(resolve => {

    const start =
      Date.now();

    const timeout =
      30000;

    function check() {

      const keys =
        Object.keys(
          streamingQueues
        );

      const pending =
        keys.some(key => {

          const queue =
            streamingQueues[key];

          return (
            queue &&
            queue.length > 0
          );

        });

      if (
        !pending ||
        Date.now() - start >= timeout
      ) {

        resolve();

        return;
      }

      setTimeout(
        check,
        100
      );
    }

    check();
  });
}


/* =========================================================
   FOLLOW-UP
========================================================= */

async function askFollowUp() {

  const input =
    document.getElementById(
      "followupInput"
    );

  const question =
    input.value.trim();

  if (
    !question ||
    !lastResult
  ) {
    return;
  }

  const askButton =
    document.getElementById(
      "askBtn"
    );

  const chatLog =
    document.getElementById(
      "chatLog"
    );

  const questionDiv =
    document.createElement("div");

  questionDiv.className =
    "chat-q";

  questionDiv.textContent =
    question;

  chatLog.appendChild(
    questionDiv
  );

  const answerDiv =
    document.createElement("div");

  answerDiv.className =
    "chat-a";

  answerDiv.textContent =
    "Thinking...";

  chatLog.appendChild(
    answerDiv
  );

  input.value = "";

  askButton.disabled = true;

  const context = {

    problem:
      lastProblem,

    analysis:
      getAgentText(
        lastResult.analysis
      ),

    solutionA:
      getAgentText(
        lastResult.refined
      ),

    solutionB:
      lastResult.mode === "full"
        ? getAgentText(
            lastResult.solutionB
          )
        : null,

    verdict:
      lastResult.mode === "full"
        ? getAgentText(
            lastResult.verdict
          )
        : null
  };

  try {

    const response =
      await fetch(
        "/api/followup",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              context,
              question
            })
        }
      );

    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Server returned invalid JSON."
      );
    }

    if (!response.ok) {

      throw new Error(
        data.error ||
        "Something went wrong."
      );
    }

    answerDiv.textContent =
      data.answer ||
      "No answer returned.";

  } catch (error) {

    answerDiv.textContent =
      error.message ||
      "Something went wrong.";

  } finally {

    askButton.disabled =
      false;

    updateCurrentHistoryChatLog();
  }
}


/* =========================================================
   ENTER KEY
========================================================= */

document
  .getElementById("followupInput")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        askFollowUp();
      }

    }
  );


/* =========================================================
   DOWNLOAD PDF
========================================================= */

function downloadPDF() {

  if (!lastResult) {
    return;
  }

  if (
    !window.jspdf ||
    !window.jspdf.jsPDF
  ) {

    alert(
      "PDF library could not be loaded."
    );

    return;
  }

  const {
    jsPDF
  } =
    window.jspdf;

  const doc =
    new jsPDF();

  const pageWidth =
    doc.internal.pageSize.getWidth();

  const pageHeight =
    doc.internal.pageSize.getHeight();

  const margin = 15;

  const maxWidth =
    pageWidth -
    margin * 2;

  let y = 20;

  function ensureSpace(height) {

    if (
      y + height >
      pageHeight - 15
    ) {

      doc.addPage();

      y = 20;
    }
  }

  function addSection(
    title,
    text
  ) {

    text =
      text ||
      "No result.";

    ensureSpace(20);

    doc.setFont(
      "helvetica",
      "bold"
    );

    doc.setFontSize(13);

    doc.text(
      title,
      margin,
      y
    );

    y += 8;

    doc.setFont(
      "helvetica",
      "normal"
    );

    doc.setFontSize(10);

    const lines =
      doc.splitTextToSize(
        String(text),
        maxWidth
      );

    lines.forEach(line => {

      ensureSpace(6);

      doc.text(
        line,
        margin,
        y
      );

      y += 5.5;

    });

    y += 8;
  }

  doc.setFont(
    "helvetica",
    "bold"
  );

  doc.setFontSize(18);

  doc.text(
    "AI War Room Report",
    margin,
    y
  );

  y += 10;

  doc.setFont(
    "helvetica",
    "italic"
  );

  doc.setFontSize(11);

  const problemLines =
    doc.splitTextToSize(
      "Problem: " +
      lastProblem,
      maxWidth
    );

  problemLines.forEach(line => {

    ensureSpace(6);

    doc.text(
      line,
      margin,
      y
    );

    y += 6;

  });

  y += 6;

  addSection(
    "Problem Analysis",
    getAgentText(
      lastResult.analysis
    )
  );

  addSection(
    "Solution A",
    getAgentText(
      lastResult.solutionA
    )
  );

  if (
    lastResult.mode === "full"
  ) {

    addSection(
      "Solution B",
      getAgentText(
        lastResult.solutionB
      )
    );

    addSection(
      "Cost Critique — A",
      getAgentText(
        lastResult.costReviewA
      )
    );

    addSection(
      "Feasibility Critique — A",
      getAgentText(
        lastResult.feasibilityReviewA
      )
    );

    addSection(
      "Cost Critique — B",
      getAgentText(
        lastResult.costReviewB
      )
    );

    addSection(
      "Feasibility Critique — B",
      getAgentText(
        lastResult.feasibilityReviewB
      )
    );

    addSection(
      "AI A Rebuttal",
      getAgentText(
        lastResult.rebuttalA
      )
    );

    addSection(
      "AI B Rebuttal",
      getAgentText(
        lastResult.rebuttalB
      )
    );

    addSection(
      "AI A Cross-Exam",
      getAgentText(
        lastResult.crossExamA
      )
    );

    addSection(
      "AI B Cross-Exam",
      getAgentText(
        lastResult.crossExamB
      )
    );

    addSection(
      "Verifier — Fact Check",
      getAgentText(
        lastResult.verifier
      )
    );

    addSection(
      "Judge — Unresolved Issues",
      getAgentText(
        lastResult.judgeIssues
      )
    );

    addSection(
      "AI A — Issue Response",
      getAgentText(
        lastResult.issueResponseA
      )
    );

    addSection(
      "AI B — Issue Response",
      getAgentText(
        lastResult.issueResponseB
      )
    );

    addSection(
      "Final Verdict",
      getAgentText(
        lastResult.verdict
      )
    );

    addSection(
      "Red Team Review",
      getAgentText(
        lastResult.redTeamReview
      )
    );
  }

  addSection(
    "Refined Winning Solution",
    getAgentText(
      lastResult.refined
    )
  );

  doc.save(
    "ai-war-room-report.pdf"
  );
}
